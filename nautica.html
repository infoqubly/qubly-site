<!DOCTYPE html>
<html lang="en">

<head>

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css?v=29">
    <!-- PhotoSwipe CSS -->
    <link rel="stylesheet" href="https://unpkg.com/photoswipe@5.4.3/dist/photoswipe.css">
    <link rel="icon" href="favicon.png" type="image/png">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">
        <a href="index.html" class="logo">
            <img src="logo.png" alt="QUBLY">
        </a>

        <div class="menu-toggle">
            <div class="hamburger-line"></div>
        </div>
    </header>

    <!-- FULLSCREEN MENU -->
    <div class="fullscreen-menu">
        <ul class="menu-list">
            <li class="menu-item"><a href="index.html" data-i18n="nav_home">Home</a></li>
            <li class="menu-item"><a href="about.html" data-i18n="nav_about">About Us</a></li>

    <!-- MAIN CONTENT WRAPPER -->
    <main id="main-content-wrapper" style="position: relative; overflow: hidden; background-color: var(--bg-color); min-height: 100vh;">

        <img src="Sfondo.webp" id="scrolling-texture" alt=""
            style="position: absolute; top: 0; left: 0; width: 100%; height: auto; min-height: 100%; object-fit: cover; z-index: 1; pointer-events: none; opacity: 1;">

        <!-- GALLERY SECTION -->
        <section class="gallery-section pswp-gallery" id="gallery">
            <h2 class="service-title" style="margin-top: 6vw;" data-i18n="proj_marine">MARINE</h2>
            
            <div class="masonry-gallery layout-3">
                <!-- IMMAGINI NAUTICA: Rinomina i tuoi file come 01.jpg, 02.jpg, ecc. e mettili nella cartella PS/nautica/ -->
                <!-- Se il file non esiste, mostrerà l'immagine di default (marine.png) -->
                
                <a href="PS/nautica/01.jpg" target="_blank" class="masonry-item">
                    <img src="PS/nautica/01.jpg" alt="Marine 1" onerror="this.onerror=null; this.src='PS/nautica/marine.png'; this.parentNode.href='PS/nautica/marine.png';" />
                </a>
                <a href="PS/nautica/02.jpg" target="_blank" class="masonry-item">
                    <img src="PS/nautica/02.jpg" alt="Marine 2" onerror="this.onerror=null; this.src='PS/nautica/marine.png'; this.parentNode.href='PS/nautica/marine.png';" />
                </a>
                <a href="PS/nautica/03.jpg" target="_blank" class="masonry-item">
                    <img src="PS/nautica/03.jpg" alt="Marine 3" onerror="this.onerror=null; this.src='PS/nautica/marine.png'; this.parentNode.href='PS/nautica/marine.png';" />
                </a>
                <a href="PS/nautica/04.jpg" target="_blank" class="masonry-item">
                    <img src="PS/nautica/04.jpg" alt="Marine 4" onerror="this.onerror=null; this.src='PS/nautica/marine.png'; this.parentNode.href='PS/nautica/marine.png';" />
                </a>
                <a href="PS/nautica/05.jpg" target="_blank" class="masonry-item">
                    <img src="PS/nautica/05.jpg" alt="Marine 5" onerror="this.onerror=null; this.src='PS/nautica/marine.png'; this.parentNode.href='PS/nautica/marine.png';" />
                </a>
                <a href="PS/nautica/06.jpg" target="_blank" class="masonry-item">
                    <img src="PS/nautica/06.jpg" alt="Marine 6" onerror="this.onerror=null; this.src='PS/nautica/marine.png'; this.parentNode.href='PS/nautica/marine.png';" />
                </a>
                <a href="PS/nautica/07.jpg" target="_blank" class="masonry-item">
                    <img src="PS/nautica/07.jpg" alt="Marine 7" onerror="this.onerror=null; this.src='PS/nautica/marine.png'; this.parentNode.href='PS/nautica/marine.png';" />
                </a>
                <a href="PS/nautica/08.jpg" target="_blank" class="masonry-item">
                    <img src="PS/nautica/08.jpg" alt="Marine 8" onerror="this.onerror=null; this.src='PS/nautica/marine.png'; this.parentNode.href='PS/nautica/marine.png';" />

                <a href="PS/nautica/09.jpg" target="_blank" class="masonry-item">

            </div>
        </section>

        <!-- FOOTER -->
        <footer class="site-footer" style="padding: 2vw; border: none; position: relative; z-index: 10;">
            <p style="font-size: 0.8vw; color: #333; margin: 0 auto; text-align: center;">&copy; 2026 QUBLY.</p>
        </footer>
    </main>

    <!-- CUSTOM CURSOR -->
    <div id="cursor-dot" class="custom-cursor"></div>

    <!-- SPOTLIGHT CANVAS -->
    <canvas id="spotlight-canvas"></canvas>

    <!-- JS -->
    <script src="js/translations.js"></script>
    <script src="js/spotlight.js"></script>
    <script src="js/main.js"></script>

    <!-- PHOTOSWIPE SCRIPT -->
    <script type="module">
        import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe@5.4.3/dist/photoswipe-lightbox.esm.js';
        
        // Auto-calculate image dimensions for PhotoSwipe
        document.querySelectorAll('.masonry-item').forEach(link => {
            const img = link.querySelector('img');
            const setDimensions = () => {
                link.setAttribute('data-pswp-width', img.naturalWidth || 1920);
                link.setAttribute('data-pswp-height', img.naturalHeight || 1080);
            };
            if(img.complete) {
                setDimensions();
            } else {
                img.onload = setDimensions;
            }
        });

        const lightbox = new PhotoSwipeLightbox({
            gallery: '#gallery',
            children: 'a.masonry-item',
            pswpModule: () => import('https://unpkg.com/photoswipe@5.4.3/dist/photoswipe.esm.js'),
            showHideAnimationType: 'zoom',
            showAnimationDuration: 700,
            hideAnimationDuration: 700
        });
        lightbox.init();
    </script>
</body>
</html>
